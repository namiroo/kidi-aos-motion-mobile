<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[Skeleton] 폼 · 보험청구관리 | 보험개발원 대물보상 모바일 AOS</title>
<link rel="stylesheet" href="../www/css/reset.css">
<link rel="stylesheet" href="../www/css/common.css">
<link rel="stylesheet" href="../www/css/component.css">
<link rel="stylesheet" href="../www/css/page.css">
<link rel="stylesheet" href="../css/skeleton.css">
</head>
<body>
<div class="l-app l-app--plain">
  <!-- status-bar : 시안 재현용. 실제 앱에서는 제거해도 됩니다 -->
  <div class="statusbar" aria-hidden="true">
    <span class="statusbar-time">9:41</span>
    <span class="statusbar-ind">
      <svg width="16" height="10" viewBox="0 0 16 10" fill="none"><rect x="0" y="6" width="3" height="4" rx="1" fill="currentColor"/><rect x="4.3" y="4" width="3" height="6" rx="1" fill="currentColor"/><rect x="8.6" y="2" width="3" height="8" rx="1" fill="currentColor"/><rect x="12.9" y="0" width="3" height="10" rx="1" fill="currentColor"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M7.5 10.4 0.4 3.5A10 10 0 0 1 14.6 3.5Z" fill="currentColor"/></svg>
      <svg width="23" height="11" viewBox="0 0 23 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.6" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="7" rx="1.3" fill="currentColor"/><path d="M22 4v3a2 2 0 0 0 0-3Z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>
  <!-- header -->
  <header class="l-header l-header--sub">
    <a href="javascript:history.back();" class="btn-icon" aria-label="이전으로">
      <span class="ico ico-24"><img src="../www/img/icon/icon_back_24.svg" alt=""></span>
    </a>
    <h1 class="header-title">보험청구관리</h1>
    <div class="header-actions"></div>
  </header>
  <div class="tabs" role="tablist">
    <a href="#" class="tab" role="tab" aria-selected="false">청구처</a>
    <a href="#" class="tab is-active" role="tab" aria-selected="true">견인차사항</a>
    <a href="#" class="tab" role="tab" aria-selected="false">정산</a>
  </div>

  <main aria-busy="true" class="l-main l-main--has-footer" style="padding-top:16px">

    <div class="form-section-title">
      <h2 class="heading">피견인차사항</h2>
    <p class="badge-required"><span class="mark">*</span><span class="label">필수입력</span></p>
    </div>
    <div class="mt-20" style="display:flex;flex-direction:column;gap:32px">
      <div class="field">
        <label class="field-title" for="twCarNo">차량번호 <span class="req" aria-hidden="true">*</span></label>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
      <div class="field">
        <label class="field-title" for="twCarName">차량명 <span class="req" aria-hidden="true">*</span></label>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
    </div>

    <div class="mt-32"></div>
    <div class="form-section-title">
      <h2 class="heading">견인차사항</h2>
    <p class="badge-required"><span class="mark">*</span><span class="label">필수입력</span></p>
    </div>
    <div class="mt-20" style="display:flex;flex-direction:column;gap:32px">
      <div class="field">
        <span class="field-title">견인일시 <span class="req" aria-hidden="true">*</span></span>
        <div class="field-row mt-4">
          <div class="field"><label class="field-title blind" for="towStart">시작</label>
            <span class="sk sk-box sk-box--field" aria-hidden="true"></span></div>
        </div>
        <div class="field-row mt-8">
          <div class="field"><label class="field-title blind" for="towEnd">종료</label>
            <span class="sk sk-box sk-box--field" aria-hidden="true"></span></div>
        </div>
      </div>
      <div class="field-row">
      <div class="field">
        <label class="field-title" for="towCarNo">견인차량번호 <span class="req" aria-hidden="true">*</span></label>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
        <a href="#" class="btn btn--tertiary btn--md"><span class="btn-label">차량선택</span></a>
      </div>
      <div class="field">
        <label class="field-title" for="towCarName">견인차량명</label>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
      <div class="field-row">
      <div class="field">
        <label class="field-title" for="towDriver">기사명 <span class="req" aria-hidden="true">*</span></label>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
        <a href="#" class="btn btn--tertiary btn--md"><span class="btn-label">기사선택</span></a>
      </div>
      <div class="field">
        <label class="field-title" for="towDriverTel">기사 연락처 <span class="req" aria-hidden="true">*</span></label>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
      <div class="field field--g8">
        <span class="field-title">출발지 <span class="req" aria-hidden="true">*</span></span>
        <div class="field-row">
          <div class="field"><label class="field-title blind" for="towFromPost">우편번호</label>
            <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
          </div>
          <a href="#" class="btn btn--tertiary btn--md"><span class="btn-label">주소검색</span></a>
        </div>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
      <div class="field field--g8">
        <span class="field-title">경유지 <span class="req" aria-hidden="true">*</span></span>
        <div class="field-row">
          <div class="field"><label class="field-title blind" for="towViaPost">우편번호</label>
            <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
          </div>
          <a href="#" class="btn btn--tertiary btn--md"><span class="btn-label">주소검색</span></a>
        </div>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
      <div class="field field--g8">
        <span class="field-title">도착지 <span class="req" aria-hidden="true">*</span></span>
        <div class="field-row">
          <div class="field"><label class="field-title blind" for="towToPost">우편번호</label>
            <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
          </div>
          <a href="#" class="btn btn--tertiary btn--md"><span class="btn-label">주소검색</span></a>
        </div>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
      <div class="field">
        <label class="field-title" for="towWrittenAt">작성일자</label>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
      <div class="field">
        <label class="field-title" for="towCompany">업체명</label>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
      <div class="field">
        <label class="field-title" for="towBizNo">사업자등록번호</label>
        <span class="sk sk-box sk-box--field" aria-hidden="true"></span>
      </div>
    </div>
  </main>

  <!-- footer -->
  <footer class="l-footer">
    <div class="btn-group btn-group--21">
      <a href="#" class="btn btn--secondary"><span class="btn-label">이전</span></a>
      <a href="#" class="btn btn--primary"><span class="btn-label">다음</span></a>
    </div>
  </footer>
</div>
<script src="../www/js/ui.js"></script>
</body>
</html>
