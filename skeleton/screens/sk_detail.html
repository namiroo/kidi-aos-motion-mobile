<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[Skeleton] 상세 · 보험청구상세 | 보험개발원 대물보상 모바일 AOS</title>
<link rel="stylesheet" href="../www/css/reset.css">
<link rel="stylesheet" href="../www/css/common.css">
<link rel="stylesheet" href="../www/css/component.css">
<link rel="stylesheet" href="../www/css/page.css">
<link rel="stylesheet" href="../css/skeleton.css">
</head>
<body>
<div class="l-app l-app--plain">
  <!-- status-bar : 시안 재현용. 실제 앱에서는 제거해도 됩니다 -->
  <div class="statusbar" aria-hidden="true">
    <span class="statusbar-time">9:41</span>
    <span class="statusbar-ind">
      <svg width="16" height="10" viewBox="0 0 16 10" fill="none"><rect x="0" y="6" width="3" height="4" rx="1" fill="currentColor"/><rect x="4.3" y="4" width="3" height="6" rx="1" fill="currentColor"/><rect x="8.6" y="2" width="3" height="8" rx="1" fill="currentColor"/><rect x="12.9" y="0" width="3" height="10" rx="1" fill="currentColor"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M7.5 10.4 0.4 3.5A10 10 0 0 1 14.6 3.5Z" fill="currentColor"/></svg>
      <svg width="23" height="11" viewBox="0 0 23 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.6" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="7" rx="1.3" fill="currentColor"/><path d="M22 4v3a2 2 0 0 0 0-3Z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>
  <!-- header -->
  <header class="l-header l-header--sub">
    <a href="javascript:history.back();" class="btn-icon" aria-label="이전으로">
      <span class="ico ico-24"><img src="../www/img/icon/icon_back_24.svg" alt=""></span>
    </a>
    <h1 class="header-title">보험청구상세</h1>
    <div class="header-actions"></div>
  </header>

  <main aria-busy="true" class="l-main l-main--has-footer" style="padding-top:16px">
  <div class="chip-row" data-single="true" role="group">
    <button type="button" class="chip is-selected" data-ui="chip" aria-pressed="true">전체</button>
    <button type="button" class="chip" data-ui="chip" aria-pressed="false">일반</button>
  </div>
    <div class="mt-20"></div>
    <section>
      <div class="section-head" style="padding-left:0">
        <h2 class="section-head-title">피견인차량정보</h2>
        
      </div>
    <div class="detail-card">
      <div class="detail-row"><span class="label">차량번호</span><span class="value"><span class="sk sk-line" style="--w:66px" aria-hidden="true"></span></span></div>
      <div class="detail-row"><span class="label">차량명</span><span class="value"><span class="sk sk-line" style="--w:78px" aria-hidden="true"></span></span></div>
    </div>
    </section>
    <div class="mt-20"></div>
    <section>
      <div class="section-head" style="padding-left:0">
        <h2 class="section-head-title">견인차량 정보</h2>
        
      </div>
    <div class="detail-card">
      <div class="detail-row"><span class="label">차량번호</span><span class="value"><span class="sk sk-line" style="--w:66px" aria-hidden="true"></span></span></div>
      <div class="detail-row"><span class="label">기사명</span><span class="value"><span class="sk sk-line" style="--w:43px" aria-hidden="true"></span></span></div>
    </div>
    </section>
    <div class="mt-20"></div>
    <section>
      <div class="section-head" style="padding-left:0">
        <h2 class="section-head-title">청구처 정보</h2>
        
      </div>
    <div class="detail-card">
      <div class="detail-row"><span class="label">보험사명</span><span class="value"><span class="sk sk-line" style="--w:43px" aria-hidden="true"></span></span></div>
      <div class="detail-row"><span class="label">접수번호</span><span class="value"><span class="sk sk-line" style="--w:104px" aria-hidden="true"></span></span></div>
      <div class="detail-row"><span class="label">담당자</span><span class="value"><span class="sk sk-line" style="--w:43px" aria-hidden="true"></span></span></div>
      <div class="detail-row"><span class="label">청구금액</span><span class="value"><span class="sk sk-line" style="--w:80px" aria-hidden="true"></span></span></div>
      <div class="detail-row"><span class="label">청구일자</span><span class="value"><span class="sk sk-line" style="--w:80px" aria-hidden="true"></span></span></div>
      <div class="detail-row"><span class="label">상태</span><span class="value"><span class="sk sk-line" style="--w:28px" aria-hidden="true"></span></span></div>
      <div class="detail-row"><span class="label">미결</span><span class="value"><span class="sk sk-line" style="--w:16px" aria-hidden="true"></span></span></div>
    </div>
    </section>
  </main>

  <!-- footer -->
  <footer class="l-footer">
    <a href="#" class="btn btn--primary btn--block"><span class="btn-label">수정</span></a>
  </footer>
</div>
<script src="../www/js/ui.js"></script>
</body>
</html>
